<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puskesmas Kokap II</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
font-family:'Space Grotesk',sans-serif;
background:radial-gradient(circle at 20% 10%, #1a1a2e, #090912 70%);
color:white;
overflow-x:hidden;
}

/* glass */
.glass{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(30px);
border:1px solid rgba(255,255,255,0.12);
box-shadow:0 10px 40px rgba(0,0,0,0.45);
}

/* navbar button */
.mac-btn{
background:rgba(255,255,255,0.08);
padding:8px 16px;
border-radius:12px;
transition:.25s;
}
.mac-btn:hover{
background:rgba(255,255,255,0.18);
transform:translateY(-1px);
}

/* hero slider */
.hero-slider{
position:relative;
width:100%;
aspect-ratio:16/9;
overflow:hidden;
border-radius:28px;
}
.slide{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transform:scale(1.08);
transition:opacity 1s ease, transform 6s ease;
}
.slide.active{
opacity:1;
transform:scale(1);
}

/* cards */
.card{
background:linear-gradient(145deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));
border:1px solid rgba(255,255,255,0.12);
border-radius:22px;
height:110px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:8px;
transition:.3s;
cursor:pointer;
position:relative;
overflow:hidden;
}
.card:hover{
transform:translateY(-6px);
box-shadow:0 15px 35px rgba(0,0,0,0.5);
}
.card::after{
content:"";
position:absolute;
width:120%;
height:120%;
background:radial-gradient(circle,rgba(255,255,255,0.15),transparent 60%);
opacity:0;
transition:.3s;
}
.card:hover::after{opacity:1;}

.icon{
font-size:26px;
}

/* bottom sheet */
.sheet-container{
position:fixed;
inset:0;
display:flex;
align-items:flex-end;
justify-content:center;
background:rgba(0,0,0,0.35);
backdrop-filter:blur(12px);
opacity:0;
pointer-events:none;
transition:.3s;
z-index:100;
}
.sheet-container.show{
opacity:1;
pointer-events:auto;
}
.sheet{
width:100%;
max-width:520px;
background:rgba(28,28,30,0.95);
backdrop-filter:blur(40px);
border-radius:28px 28px 0 0;
padding:20px 22px 28px;
max-height:85vh;
overflow:auto;
transform:translateY(100%);
transition:transform .35s cubic-bezier(.25,.8,.25,1);
}
.sheet-container.show .sheet{transform:translateY(0);}
.handle{
width:50px;height:5px;background:rgba(255,255,255,.4);
border-radius:999px;margin:0 auto 14px;
}

/* fade animation */
.fade-in{
animation:fade .6s ease forwards;
opacity:0;
}
@keyframes fade{
to{opacity:1; transform:none}
from{opacity:0; transform:translateY(8px)}
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="fixed top-0 w-full glass z-50">
<div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
<div class="flex items-center gap-3">
<img src="logopkm.png" class="w-10 h-10 object-contain">
<span class="font-semibold text-lg">Puskesmas Kokap II</span>
</div>
<button onclick="openSheet('contact')" class="mac-btn">Kontak</button>
</div>
</nav>

<!-- HERO -->
<section class="pt-24 pb-12 fade-in">
<div class="max-w-7xl mx-auto px-6 grid lg:grid-cols-2 gap-10 items-center">
<div>
<h1 class="text-5xl font-bold leading-tight">Bersama Pasti Bisa</h1>
<p class="mt-4 text-white/70">Menjadi Institusi yang Profesional untuk Mewujudkan Masyarakat sehat dan mandiri di Wialayah Puskesmas Kokap II.</p>
</div>
<div class="glass hero-slider">
<img src="foto1.jpg" class="slide active">
<img src="foto2.png" class="slide">
<img src="foto3.jpg" class="slide">
</div>
</div>
</section>

<!-- LAYANAN -->
<section class="pb-16 fade-in">
<div class="max-w-7xl mx-auto px-6">
<div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">

<div class="card" onclick="openSheet('ugd')">
<div class="icon">🚑</div>
<div>UGD</div>
</div>

<div class="card" onclick="openSheet('umum')">
<div class="icon">🩺</div>
<div>Pelayanan Umum</div>
</div>

<div class="card" onclick="openSheet('kia')">
<div class="icon">🤰</div>
<div>KIA</div>
</div>

<div class="card" onclick="openSheet('gigi')">
<div class="icon">😁</div>
<div>Gigi & Mulut</div>
</div>

<div class="card" onclick="openSheet('gizi')">
<div class="icon">🥗</div>
<div>Konsultasi Gizi</div>
</div>

<div class="card" onclick="openSheet('lingkungan')">
<div class="icon">🌿</div>
<div>Kesehatan Lingkungan</div>
</div>

<div class="card" onclick="openSheet('promosi')">
<div class="icon">📢</div>
<div>Promosi Kesehatan</div>
</div>

<div class="card" onclick="openSheet('manajemen')">
<div class="icon">📋</div>
<div>Administrasi</div>
</div>

</div>
</div>
</section>

<!-- BOTTOM SHEET -->
<div id="sheet" class="sheet-container" onclick="closeSheet(event)">
<div class="sheet" id="sheetBox">
<div class="handle"></div>
<div id="sheetContent"></div>
</div>
</div>

<script>
// slider
let i=0;
const slides=document.querySelectorAll(".slide");
setInterval(()=>{
slides[i].classList.remove("active");
i=(i+1)%slides.length;
slides[i].classList.add("active");
},4000);

// content (ringkas premium)
const content={
ugd:`<h3 class="text-xl font-semibold mb-4 text-center">UGD Terbatas</h3>
<p class="text-white/80">Pelayanan kegawatdaruratan dasar seperti luka ringan, asma ringan, dan pertolongan pertama. Kasus berat akan dirujuk.</p>`,

umum:`<h3 class="text-xl font-semibold mb-4 text-center">Pelayanan Umum</h3>
<p class="text-white/80">Pemeriksaan kesehatan, konsultasi dokter, pengobatan penyakit umum, dan pemeriksaan laboratorium sederhana.</p>`,

kia:`<h3 class="text-xl font-semibold mb-4 text-center">Kesehatan Ibu & Anak</h3>
<p class="text-white/80">Pemeriksaan kehamilan, imunisasi, KB, dan pemantauan tumbuh kembang anak.</p>`,

gigi:`<h3 class="text-xl font-semibold mb-4 text-center">Gigi & Mulut</h3>
<p class="text-white/80">Pemeriksaan gigi, penambalan, pencabutan sederhana, dan edukasi kesehatan gigi.</p>`,

gizi:`<h3 class="text-xl font-semibold mb-4 text-center">Konsultasi Gizi</h3>
<p class="text-white/80">Konsultasi gizi keluarga, pencegahan stunting, dan edukasi pola makan sehat.</p>`,

lingkungan:`<h3 class="text-xl font-semibold mb-4 text-center">Kesehatan Lingkungan</h3>
<p class="text-white/80">Edukasi sanitasi, air bersih, dan pencegahan penyakit berbasis lingkungan.</p>`,

promosi:`<h3 class="text-xl font-semibold mb-4 text-center">Promosi Kesehatan</h3>
<p class="text-white/80">Penyuluhan PHBS dan edukasi hidup sehat untuk masyarakat.</p>`,

manajemen:`<h3 class="text-xl font-semibold mb-4 text-center">Administrasi</h3>
<p class="text-white/80">Surat kesehatan, dan rujukan, MoU ( Perjanjian Kerjasama ), Izin penelitian, dll </p>`,

contact:`<h3 class="text-xl font-semibold text-center mb-4">Hubungi Kami</h3>
<a href="#" class="block py-3 rounded-xl bg-green-500 text-center font-semibold mb-2">WhatsApp</a>
<a href="#" class="block py-3 rounded-xl bg-pink-500 text-center font-semibold mb-2">Instagram</a>
<a href="#" class="block py-3 rounded-xl bg-black border border-white/20 text-center font-semibold">TikTok</a>`
};

function openSheet(type){
document.getElementById("sheetContent").innerHTML=content[type];
document.getElementById("sheet").classList.add("show");
}
function closeSheet(e){
if(e.target.id==="sheet"){
document.getElementById("sheet").classList.remove("show");
}
}
</script>

</body>
</html>
