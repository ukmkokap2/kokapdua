<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puskesmas Kokap II</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://unpkg.com/lucide@latest"></script>

<style>

/* ====== (SEMUA CSS ANDA TETAP) ====== */

.contact-btn{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
padding:12px;
font-weight:600;
border-radius:14px;
transition:.25s;
backdrop-filter:blur(20px);
}

.contact-btn:hover{ transform:translateY(-2px); }
.contact-btn:active{ transform:scale(.96); }

:root{ color-scheme: light dark; }

body{
font-family:'Space Grotesk',sans-serif;
background:linear-gradient(180deg,#f5f6fa,#eef1f6);
color:#1c1c1e;
overflow-x:hidden;
transition:.4s ease;
}

.dark body{
background:linear-gradient(180deg,#0b0b12,#050508);
color:white;
}

body::after{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:radial-gradient(circle at var(--x,50%) var(--y,50%), rgba(0,0,0,0.08), transparent 35%);
transition:opacity .25s ease;
}

.dark body::after{
background:radial-gradient(circle at var(--x,50%) var(--y,50%), rgba(255,255,255,0.10), transparent 35%);
}

.glass{
background:rgba(255,255,255,0.65);
backdrop-filter:blur(26px) saturate(180%);
border:1px solid rgba(255,255,255,0.9);
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}
.dark .glass{
background:rgba(30,30,35,0.55);
border:1px solid rgba(255,255,255,0.08);
box-shadow:0 10px 30px rgba(0,0,0,0.45);
}

nav{ transition:.35s ease; }
nav.scrolled{
background:rgba(255,255,255,0.85);
backdrop-filter:blur(30px);
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}
.dark nav.scrolled{ background:rgba(25,25,30,0.75); }

.mac-btn{
background:white;
border-radius:12px;
border:1px solid rgba(0,0,0,0.06);
padding:8px 14px;
transition:.25s;
display:flex;
align-items:center;
justify-content:center;
}
.mac-btn:hover{
transform:translateY(-1px);
box-shadow:0 6px 14px rgba(0,0,0,0.12);
}
.mac-btn:active{ transform:scale(.95); }
.dark .mac-btn{
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.12);
}

/* hero slider tetap */
.hero-slider{
position:relative;
width:100%;
aspect-ratio:16/9;
overflow:hidden;
border-radius:28px;
border:1px solid rgba(0,0,0,0.08);
box-shadow:0 15px 40px rgba(0,0,0,0.12);
}
.slide{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transform:scale(1.05);
transition:opacity 1s ease, transform 6s ease;
}
.slide.active{ opacity:1; transform:scale(1); }

/* card */
.card{
background:linear-gradient(180deg,#ffffff,#f2f3f7);
border:1px solid rgba(0,0,0,0.06);
border-radius:22px;
height:110px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:8px;
cursor:pointer;
transition:.25s;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
}
.card:hover{
transform:translateY(-4px);
box-shadow:0 14px 30px rgba(0,0,0,0.15);
}
.dark .card{
background:linear-gradient(180deg,#1c1c1e,#121214);
border:1px solid rgba(255,255,255,0.08);
}

/* ===================================================== */
/* ✅ PERBAIKAN SLIDER PENGUMUMAN (ANTI TERPOTONG MOBILE) */
/* ===================================================== */

#announcementSlider{
position:relative;
min-height:48px;        /* menjaga tinggi minimum */
padding-bottom:14px;    /* ruang indikator dot */
}

.announcement-slide{
position:absolute;
top:0;
left:0;
width:100%;
opacity:0;
transition:opacity .6s ease;
line-height:1.45;
word-wrap:break-word;
}

.announcement-slide.active{
position:relative;   /* slide aktif menentukan tinggi box */
opacity:1;
}

/* indikator dot tetap */
.announcement-dots{
position:absolute;
bottom:6px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:6px;
}

.announcement-dots span{
width:6px;
height:6px;
border-radius:50%;
background:rgba(0,0,0,0.25);
transition:.3s;
}

.dark .announcement-dots span{
background:rgba(255,255,255,0.35);
}

.announcement-dots span.active{
width:16px;
border-radius:6px;
background:#007aff;
}

/* mobile font adjustment */
@media (max-width:640px){
  .announcement-slide{
    font-size:14px;
  }
}

/* bottom sheet tetap */
.sheet-container{
position:fixed; inset:0;
display:flex; align-items:flex-end; justify-content:center;
background:rgba(0,0,0,0.35);
backdrop-filter:blur(20px);
opacity:0; pointer-events:none;
transition:.3s; z-index:100;
}
.sheet-container.show{ opacity:1; pointer-events:auto; }
.sheet{
width:100%; max-width:520px;
background:rgba(255,255,255,0.95);
border-radius:28px 28px 0 0;
padding:20px 22px 28px;
max-height:85vh; overflow:auto;
transform:translateY(100%);
transition:.35s cubic-bezier(.25,.8,.25,1);
}
.dark .sheet{ background:rgba(40,40,45,0.92); }
.sheet-container.show .sheet{ transform:translateY(0); }

.handle{
width:50px;height:5px;background:rgba(0,0,0,.3);
border-radius:999px;margin:0 auto 14px;
}

</style>
</head>
